# Sustituto VACIO de certbot/ionos.ini para los servidores sin reto DNS-01 (sin credencial de
# IONOS). docker-compose.yml lo monta en /etc/letsencrypt/ionos.ini cuando
# NGINX_CERTBOT_IONOS_CREDENTIALS va vacia en .env, para que Docker no cree una carpeta en su lugar.
# No poner aqui ninguna credencial: este archivo SI se versiona.
