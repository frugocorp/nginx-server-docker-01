name: Deploy

on:
  push:
    branches: [main]

jobs:
  # Un job por servidor: corren en paralelo y la falla de uno no detiene al otro.
  deploy-frugocorp:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Redesplegar
        run: |
          ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=accept-new \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} << 'EOF'
            set -e
            cd ~/nginx-server-docker-01
            git pull origin main
            # Valida la configuracion nueva (compose, plantillas y .env de este servidor) en un
            # contenedor aparte ANTES de tocar el nginx que esta corriendo: si falla, "set -e" corta
            # aqui y el nginx actual sigue atendiendo con su configuracion anterior.
            # -T y < /dev/null son obligatorios: estos comandos llegan por la entrada estandar del ssh
            # (heredoc), y sin ellos "docker compose run" se traga las lineas que siguen y "up" y
            # "restart" nunca se ejecutan, aunque el job termine en verde.
            docker compose build
            docker compose run --rm --no-deps -T nginx nginx -t < /dev/null
            docker compose up -d --build
            docker compose restart nginx
          EOF

  deploy-softlag:
    runs-on: ubuntu-latest
    steps:
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SOFTLAG_DEPLOY_SSH_KEY }}

      - name: Redesplegar
        run: |
          ssh -p ${{ secrets.SOFTLAG_SSH_PORT }} -o StrictHostKeyChecking=accept-new \
            ${{ secrets.SOFTLAG_DEPLOY_USER }}@${{ secrets.SOFTLAG_DEPLOY_HOST }} << 'EOF'
            set -e
            cd ~/nginx-server-docker-01
            git pull origin main
            # Valida la configuracion nueva (compose, plantillas y .env de este servidor) en un
            # contenedor aparte ANTES de tocar el nginx que esta corriendo: si falla, "set -e" corta
            # aqui y el nginx actual sigue atendiendo con su configuracion anterior.
            # -T y < /dev/null son obligatorios: estos comandos llegan por la entrada estandar del ssh
            # (heredoc), y sin ellos "docker compose run" se traga las lineas que siguen y "up" y
            # "restart" nunca se ejecutan, aunque el job termine en verde.
            docker compose build
            docker compose run --rm --no-deps -T nginx nginx -t < /dev/null
            docker compose up -d --build
            docker compose restart nginx
          EOF
